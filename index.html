<script>
/* ==================================================================
   1. UTILITAIRES
   ================================================================== */
const KEY = 'fittrack_v1';
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const r0 = n => Math.round(n || 0);
const r1 = n => Math.round((n || 0) * 10) / 10;
const fr = (n, d = 1) => (+n || 0).toLocaleString('fr-FR', { maximumFractionDigits: d });
const fmtKg = v => (v === '' || v == null) ? '–' : fr(v, 2);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const toDate = iso => new Date(iso + 'T12:00:00');
const addDays = (iso, n) => { const d = toDate(iso); d.setDate(d.getDate() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 864e5);
const fmtShort = iso => toDate(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
const fmtMed = iso => toDate(iso).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtLong = iso => toDate(iso).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const weekStart = iso => { const d = toDate(iso); const wd = (d.getDay() + 6) % 7; return addDays(iso, -wd); };
const mmss = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const ago = n => n === 0 ? "aujourd'hui" : n === 1 ? 'hier' : `il y a ${n} j`;
const ic = (name, cls = 'w-5 h-5') => `<i data-lucide="${name}" class="${cls}"></i>`;
const typeLabel = t => t === 'upper' ? 'Upper' : 'Lower';
const typeSub = t => t === 'upper' ? 'Haut du corps' : 'Bas du corps';
const MAC = { p: '#2dd4bf', f: '#fbbf24', c: '#a78bfa', k: '#4da3ff' };

function icons() { try { window.lucide && lucide.createIcons(); } catch (e) {} }

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  const c = type === 'err' ? 'border-red-400/50 text-red-200' : 'border-arc/40 text-slate-100';
  el.className = `pop pointer-events-auto max-w-md w-full sm:w-auto rounded-xl border ${c} bg-ink-800 shadow-xl px-4 py-3 text-sm font-medium`;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = 0; setTimeout(() => el.remove(), 300); }, 2600);
}

function openModal(html) { $('modalPanel').innerHTML = html; $('modal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; icons(); }
function closeModal() { $('modal').classList.add('hidden'); document.body.style.overflow = ''; DRAFT = null; TP.on = false; }

/* ---- Son, vibration, écran allumé ---- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq = 880, dur = .15, when = 0, vol = .3) {
  if (!D.settings.sound) return;
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, ac.currentTime + when);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + when + dur);
  o.connect(g).connect(ac.destination);
  o.start(ac.currentTime + when); o.stop(ac.currentTime + when + dur + .02);
}
function alarm() { [0, .25, .5].forEach(t => beep(1046, .18, t, .4)); try { navigator.vibrate && navigator.vibrate([300, 120, 300, 120, 300]); } catch (e) {} }
let WL = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !WL) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => WL = null); }
    else if (!on && WL) { await WL.release(); WL = null; }
  } catch (e) {}
}

/* ==================================================================
   2. DONNÉES PAR DÉFAUT & PERSISTANCE (localStorage)
   ================================================================== */
const ex = (name, sets, repMin, repMax, inc, secondary, rest, tempo) => ({ id: uid(), name, sets, repMin, repMax, inc, secondary, rest, tempo: tempo || (secondary ? '2-0-1-1' : '3-1-1-0') });
const food = (name, kcal, p, f, c) => ({ name, kcal, p, f, c });
const ing = (f, qty) => ({ ...f, qty });

function defaultData() {
  const F = {
    poulet: food('Blanc de poulet cru', 110, 23, 1.5, 0),
    riz: food('Riz basmati cru', 350, 8, 1, 77),
    pates: food('Pâtes complètes crues', 350, 13, 2.5, 66),
    avoine: food("Flocons d'avoine", 370, 13, 7, 59),
    patate: food('Patate douce crue', 86, 1.6, 0.1, 20),
    boeuf: food('Bœuf haché 5% cru', 125, 21, 5, 0),
    oeuf: food('Œuf entier (≈60 g)', 143, 12.5, 10, 0.7),
    skyr: food('Skyr nature', 63, 11, 0.2, 4),
    whey: food('Whey protéine', 380, 78, 6, 6),
    huile: food("Huile d'olive", 900, 0, 100, 0),
    brocoli: food('Brocoli', 34, 2.8, 0.4, 7),
    banane: food('Banane', 89, 1.1, 0.3, 23),
    amandes: food('Amandes', 600, 21, 50, 7),
    lentilles: food('Lentilles corail crues', 340, 24, 1.5, 50),
    fblanc: food('Fromage blanc 0%', 46, 7.5, 0.2, 4),
    thon: food('Thon au naturel', 115, 26, 1, 0),
    tomates: food('Tomates concassées', 25, 1.2, 0.2, 4),
    oignon: food('Oignon', 40, 1.1, 0.1, 9),
    pain: food('Pain complet', 250, 9, 3, 45),
    lait: food('Lait demi-écrémé', 46, 3.2, 1.6, 4.8),
  };
  return {
    version: 1,
    settings: { kcal: 2616, p: 181, f: 78, c: 296, runBonus: 200, rest: 120, sound: true },
    program: {
      upper: [
        ex('Développé couché', 3, 6, 10, 2.5, false, 150),
        ex('Rowing barre', 3, 8, 12, 2.5, false, 120),
        ex('Développé militaire haltères', 3, 8, 12, 2, false, 120),
        ex('Tirage vertical', 3, 10, 12, 2.5, false, 90),
        ex('Élévations latérales', 3, 12, 15, 1, true, 60),
        ex('Curl haltères', 2, 10, 12, 1, true, 60),
        ex('Extension triceps poulie', 2, 10, 12, 2.5, true, 60),
      ],
      lower: [
        ex('Presse à cuisses', 3, 8, 12, 5, false, 150),
        ex('Soulevé de terre roumain', 3, 8, 10, 2.5, false, 150),
        ex('Fentes bulgares', 3, 8, 12, 2, false, 90),
        ex('Leg curl', 3, 10, 15, 2.5, false, 90),
        ex('Mollets debout', 3, 12, 15, 2.5, true, 60),
        ex('Crunch à la poulie', 3, 12, 15, 2.5, true, 60),
      ],
    },
    next: 'upper', sessions: [], active: null,
    foods: Object.values(F),
    recipes: [
      { id: uid(), name: 'Poulet · riz · brocoli', cat: 'Meal prep', portions: 5,
        ingredients: [ing(F.poulet, 900), ing(F.riz, 400), ing(F.brocoli, 750), ing(F.huile, 30)] },
      { id: uid(), name: 'Bolognaise bœuf & pâtes complètes', cat: 'Meal prep', portions: 5,
        ingredients: [ing(F.boeuf, 750), ing(F.pates, 450), ing(F.tomates, 800), ing(F.oignon, 150), ing(F.huile, 15)] },
      { id: uid(), name: 'Overnight oats protéinés', cat: 'Collation', portions: 1,
        ingredients: [ing(F.avoine, 60), ing(F.skyr, 150), ing(F.whey, 30), ing(F.banane, 100)] },
    ],
    quick: [
      { id: uid(), name: 'Shaker whey + 300 ml lait', kcal: 252, p: 33, f: 6.6, c: 16 },
      { id: uid(), name: '3 œufs + 2 tranches pain complet', kcal: 457, p: 31, f: 21, c: 37 },
    ],
    meals: {}, runDays: {}, plan: {}, shopChecked: {}, shopExtra: [],
    weights: [], runs: [], mobility: [],
  };
}

function migrate(d) {
  const def = defaultData();
  for (const k in def) if (d[k] === undefined) d[k] = def[k];
  d.settings = { ...def.settings, ...d.settings };
  d.program = { upper: d.program.upper || [], lower: d.program.lower || [] };
  ['upper', 'lower'].forEach(t => d.program[t].forEach(e => { if (!e.tempo) e.tempo = e.secondary ? '2-0-1-1' : '3-1-1-0'; }));
  return d;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) { console.warn(e); }
  return defaultData();
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(D)); }
  catch (e) { toast('Impossible de sauvegarder (stockage plein ?)', 'err'); }
}
function save() { D.updatedAt = Date.now(); persist(); syncSchedule(); }
let D = load();

/* ==================================================================
   2b. SYNCHRONISATION TÉLÉPHONE ↔ ORDINATEUR (via un Gist GitHub privé)
   - Le "code d'accès" GitHub reste dans CE navigateur uniquement (jamais exporté).
   - Les données sont envoyées automatiquement après chaque modification
     et récupérées au lancement, au retour sur l'onglet, puis toutes les 45 s.
   - En cas de conflit, la modification la plus récente l'emporte.
   ================================================================== */
const SKEY = 'bluearc_sync', GFILE = 'bluearc-data.json';
function loadSync() { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } }
function saveSync() { try { localStorage.setItem(SKEY, JSON.stringify(SYNC)); } catch (e) {} }
let SYNC = loadSync();
const SY = { busy: false, pending: false, timer: null, status: 'idle', msg: '' };

async function gh(path, opts = {}) {
  const r = await fetch('https://api.github.com' + path, {
    ...opts, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + SYNC.token, Accept: 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
  });
  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function fetchRemote(id) {
  const g = await gh('/gists/' + id), f = g.files && g.files[GFILE];
  if (!f) return null;
  let txt = f.content;
  if (f.truncated || txt == null) txt = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  try { return JSON.parse(txt); } catch (e) { return null; }
}
async function pushRemote() {
  await gh('/gists/' + SYNC.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [GFILE]: { content: JSON.stringify(D) } } }) });
}
function applyRemote(remote) { D = migrate(remote); persist(); stopRest(); render(); }
function syncErr(e) { return e.status === 401 ? "Code d'accès refusé (expiré ou supprimé ?)" : e.status === 404 ? 'Espace de sauvegarde introuvable' : 'Hors ligne ou GitHub indisponible'; }
function setStatus(st, msg) { SY.status = st; SY.msg = msg || ''; paintSync(); }
function paintSync() {
  const el = $('syncStatus'); if (!el) return;
  let t = 'En attente', c = 'text-slate-400';
  if (SY.status === 'syncing') { t = 'Synchronisation…'; c = 'text-slate-300'; }
  else if (SY.status === 'err') { t = '⚠ ' + SY.msg; c = 'text-orange-300'; }
  else if (SYNC.last) { t = '✓ Synchronisé à ' + new Date(SYNC.last).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); c = 'text-arc'; }
  el.textContent = t; el.className = 'mt-3 text-sm font-semibold ' + c;
}
function syncSchedule() {
  if (!SYNC.token || !SYNC.gistId) return;
  clearTimeout(SY.timer);
  SY.timer = setTimeout(() => { if (SY.busy) SY.pending = true; else syncNow(); }, 2500);
}
async function syncNow(manual) {
  if (!SYNC.token || !SYNC.gistId) return;
  if (SY.busy) { if (manual) toast('Synchronisation en cours…'); return; }
  SY.busy = true; setStatus('syncing');
  try {
    const remote = await fetchRemote(SYNC.gistId), ru = (remote && remote.updatedAt) || 0, lu = D.updatedAt || 0;
    if (ru > lu) {
      const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
      if (typing && !manual) { /* l'utilisateur saisit : on réessaiera au prochain passage */ }
      else { applyRemote(remote); if (manual) toast('Données mises à jour depuis le cloud ✅'); }
    } else if (lu > ru) { await pushRemote(); if (manual) toast('Données envoyées ✅'); }
    else if (manual) toast('Déjà à jour ✅');
    SYNC.last = Date.now(); saveSync(); setStatus('ok');
  } catch (e) { setStatus('err', syncErr(e)); if (manual) toast(SY.msg, 'err'); }
  finally { SY.busy = false; if (SY.pending) { SY.pending = false; syncSchedule(); } }
}
async function syncConnect(token) {
  SYNC = { token }; SY.busy = true; setStatus('syncing');
  try {
    let found = null;
    for (let page = 1; page <= 5 && !found; page++) {
      const list = await gh(`/gists?per_page=100&page=${page}`);
      found = list.find(g => g.files && g.files[GFILE]);
      if (list.length < 100) break;
    }
    if (found) {
      SYNC.gistId = found.id;
      const remote = await fetchRemote(found.id), localHas = (D.updatedAt || 0) > 0;
      if (remote && (!localHas || confirm("Des données existent déjà dans le cloud.\n\nOK = récupérer celles du cloud (remplace les données de cet appareil)\nAnnuler = envoyer celles de cet appareil dans le cloud"))) {
        applyRemote(remote); toast('Données récupérées depuis le cloud ✅');
      } else { D.updatedAt = Date.now(); persist(); await pushRemote(); toast('Données envoyées dans le cloud ✅'); }
    } else {
      D.updatedAt = Date.now(); persist();
      const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'BlueArc — données de suivi', public: false, files: { [GFILE]: { content: JSON.stringify(D) } } }) });
      SYNC.gistId = g.id; toast('Synchronisation activée ✅');
    }
    SYNC.last = Date.now(); saveSync(); setStatus('ok');
  } catch (e) { SYNC = {}; saveSync(); setStatus('err', syncErr(e)); toast(SY.msg, 'err'); }
  finally { SY.busy = false; }
}
function syncCard() {
  const on = !!(SYNC.token && SYNC.gistId);
  return `<section class="card lg:col-span-2">

/* ==================================================================
   3. LOGIQUE ENTRAÎNEMENT (rotation, double progression)
   ================================================================== */
function lastPerf(exId) {
  for (let i = D.sessions.length - 1; i >= 0; i--) {
    const e = D.sessions[i].exercises.find(x => x.exId === exId && !x.skipped && x.sets.length);
    if (e) return { date: D.sessions[i].date, sets: e.sets };
  }
  return null;
}

/* Double progression : on monte les reps jusqu'au haut de la fourchette sur toutes les séries,
   puis on augmente la charge et on repart en bas de fourchette. */
function suggest(p, prev) {
  if (!prev) return { kg: '', reps: p.repMin, type: 'new', text: `Première fois : choisis une charge pour ${p.repMin}-${p.repMax} reps à RPE 7-8.` };
  const top = Math.max(...prev.sets.map(s => +s.kg || 0));
  const atTop = prev.sets.filter(s => (+s.kg || 0) === top);
  const maxRpe = Math.max(0, ...prev.sets.map(s => +s.rpe || 0));
  const allMax = prev.sets.length >= p.sets && atTop.length === prev.sets.length && prev.sets.every(s => +s.reps >= p.repMax);
  if (allMax && maxRpe <= 9) {
    const kg = Math.round((top + p.inc) * 100) / 100;
    return { kg, reps: p.repMin, type: 'up', text: `Haut de fourchette atteint → monte à ${fmtKg(kg)} kg (+${fmtKg(p.inc)}) et repars à ${p.repMin} reps.` };
  }
  if (allMax) return { kg: top, reps: p.repMax, type: 'hold', text: `Reps max atteintes mais RPE ${maxRpe} : consolide ${fmtKg(top)} kg avant de monter.` };
  const setReps = Array.from({ length: p.sets }, (_, j) => { const s = atTop[j] || atTop[atTop.length - 1]; return Math.min(p.repMax, (+s?.reps || p.repMin) + 1); });
  return { kg: top, reps: setReps[0], setReps, type: 'reps', text: `Même charge (${fmtKg(top)} kg), ajoute 1 rep par série jusqu'à ${p.repMax}.` };
}

function startSession(type) {
  const prog = D.program[type];
  if (!prog.length) return toast('Programme vide : ajoute des exercices dans Réglages', 'err');
  audio();
  D.active = {
    id: uid(), type, date: todayISO(), start: Date.now(), express: false,
    exercises: prog.map(p => {
      const prev = lastPerf(p.id), sg = suggest(p, prev);
      return {
        exId: p.id, name: p.name, repMin: p.repMin, repMax: p.repMax, inc: p.inc, rest: p.rest, secondary: p.secondary, tempo: p.tempo,
        skipped: false, prev, sugg: sg,
        sets: Array.from({ length: p.sets }, (_, j) => ({ kg: sg.kg ?? '', reps: sg.setReps?.[j] ?? sg.reps ?? '', rpe: '', done: false })),
      };
    }),
  };
  save(); keepAwake(true); render(); window.scrollTo(0, 0);
  toast(`Séance ${typeLabel(type)} lancée — bon courage !`);
}

function finishSession() {
  const A = D.active; if (!A) return;
  const done = A.exercises.reduce((s, e) => s + e.sets.filter(x => x.done).length, 0);
  if (!done) { if (confirm('Aucune série validée. Abandonner la séance ?')) cancelSession(true); return; }
  if (!confirm('Terminer et enregistrer la séance ?')) return;

    id: A.id, date: A.date, type: A.type, start: A.start, end: Date.now(), express: A.express,
    exercises: A.exercises.map(e => ({
      exId: e.exId, name: e.name, tempo: e.tempo, skipped: e.skipped || !e.sets.some(s => s.done),
      sets: e.sets.filter(s => s.done).map(s => ({ kg: num(s.kg), reps: num(s.reps), rpe: s.rpe === '' ? null : num(s.rpe) })),

}

}

const PH_HZ = [520, 392, 880, 988];
function parseTempo(t) {
  const a = String(t || '').split(/[^0-9]+/).filter(Boolean).map(Number);
  if (!a.length) return [3, 1, 1, 0];
  while (a.length < 4) a.push(0);
  return a.slice(0, 4).map(n => Math.min(10, n));
}
const tempoStr = t => parseTempo(t).join('-');
const TP = { on: false, done: false, i: 0, tempo: [3, 1, 1, 0], reps: 10, rep: 1, phase: -1, end: 0, left: 0, lastSec: -1 };

  if (!D.active) return;
  const e = D.active.exercises[i], s = e.sets.find(x => !x.done) || e.sets[0] || {};
  Object.assign(TP, { on: false, done: false, i, tempo: parseTempo(e.tempo), reps: Math.max(1, Math.round(num(s.reps)) || e.repMax || 10) });
  renderTempo();
}
function saveTempo() {
  const e = D.active.exercises[TP.i], t = TP.tempo.join('-');

function tpStart() {
  if (TP.tempo.reduce((a, b) => a + b, 0) <= 0) return toast('Mets au moins une phase à 1 s', 'err');
  audio();
  Object.assign(TP, { on: true, done: false, rep: 1, phase: -1, end: Date.now() + 3000, left: 3, lastSec: 3 });
  renderTempo();
}
function tpAdvance() {
  let ph = TP.phase, rep = TP.rep;
  for (let n = 0; n < 6; n++) {
    ph++; if (ph > 3) { ph = 0; rep++; }
    if (rep > TP.reps || TP.tempo[ph] > 0) break;
  }
  if (rep > TP.reps) { TP.on = false; TP.done = true; alarm(); renderTempo(); return; }
  TP.phase = ph; TP.rep = rep; TP.end = Date.now() + TP.tempo[ph] * 1000; TP.left = TP.tempo[ph]; TP.lastSec = TP.tempo[ph];
  beep(PH_HZ[ph], .14, 0, .35);
  try { navigator.vibrate && navigator.vibrate(ph === 0 || ph === 2 ? 40 : 15); } catch (e) {}
  tpUI();
}
function tpTick(now) {
  TP.left = (TP.end - now) / 1000;
  if (TP.left <= 0) return tpAdvance();
  const sec = Math.ceil(TP.left);
  if (sec !== TP.lastSec) { TP.lastSec = sec; beep(1250, .05, 0, .12); }
  tpUI();
}
function tpUI() {

    $('tpPhase').textContent = TP.done ? 'Série terminée !' : 'Prêt ?';

  $('tpBar').style.background = col;
  $('tpRep').textContent = TP.phase < 0 ? `${TP.reps} reps` : `Rep ${Math.min(TP.rep, TP.reps)} / ${TP.reps}`;
}
function renderTempo() {

function isRunDay(date) { return D.runDays[date] !== undefined ? D.runDays[date] : D.runs.some(r => r.date === date); }
function targetsFor(date) {
  const s = D.settings, run = isRunDay(date), b = run ? num(s.runBonus) : 0;

function dayTotals(date) {
  return (D.meals[date] || []).reduce((t, m) => ({ kcal: t.kcal + num(m.kcal), p: t.p + num(m.p), f: t.f + num(m.f), c: t.c + num(m.c) }), { kcal: 0, p: 0, f: 0, c: 0 });
}
function addMeal(date, m) { (D.meals[date] = D.meals[date] || []).push({ id: uid(), time: Date.now(), ...m }); save(); }
function recipeTotals(r) {
  const t = { kcal: 0, p: 0, f: 0, c: 0 };
  (r.ingredients || []).forEach(i => { const k = num(i.qty) / 100; t.kcal += num(i.kcal) * k; t.p += num(i.p) * k; t.f += num(i.f) * k; t.c += num(i.c) * k; });
  const n = Math.max(1, num(r.portions) || 1);
  return { total: t, per: { kcal: t.kcal / n, p: t.p / n, f: t.f / n, c: t.c / n } };
}
function shoppingList() {
  const map = {};
  for (const [rid, n] of Object.entries(D.plan)) {
    if (!n) continue;
    const r = D.recipes.find(x => x.id === rid); if (!r) continue;
    r.ingredients.forEach(i => {
      const k = (i.name || '').trim().toLowerCase(); if (!k) return;
      map[k] = map[k] || { key: k, name: i.name.trim(), qty: 0, from: new Set() };
      map[k].qty += num(i.qty) * n; map[k].from.add(r.name);

}
const fmtQty = g => g >= 1000 ? fr(g / 1000, 2) + ' kg' : r0(g) + ' g';

function weightSeries() {
  const w = [...D.weights].sort((a, b) => a.date.localeCompare(b.date));
  return w.map(x => {
    const win = w.filter(y => { const d = daysBetween(y.date, x.date); return d >= 0 && d < 7; });
    return { ...x, avg: win.reduce((s, y) => s + y.kg, 0) / win.length };

}

}

/* ==================================================================
   6. BOUCLE D'HORLOGE (repos, mobilité, durée de séance)
   ================================================================== */
function tick() {
  const now = Date.now();
  if (TP.on) tpTick(now);
  // Repos
  if (REST.on) {
    const left = (REST.end - now) / 1000;
    $('restTime').textContent = mmss(left);
    $('restProg').style.width = Math.max(0, Math.min(100, left / REST.total * 100)) + '%';
    if (left <= 10 && left > 0 && !REST.warned) { REST.warned = true; beep(660, .12); }
    if (left <= 0) {
      REST.on = false; alarm();
      $('restLabel').textContent = 'Repos terminé — série suivante !';
      $('restTime').textContent = 'GO'; $('restBar').classList.add('flash');
      setTimeout(() => { if (!REST.on) $('restBar').classList.add('hidden'); }, 4000);
    }
  }
  // Durée de séance
  if (D.active && $('elapsed')) $('elapsed').textContent = mmss((now - D.active.start) / 1000);
  // Mobilité
  if (MOB.on) {
    if (MOB.paused) MOB.end = now + MOB.left * 1000;
    else MOB.left = (MOB.end - now) / 1000;
    const total = MOB.phase === 'prep' ? PREP : mobDur(MOB.idx);
    if ($('mobTime')) {
      $('mobTime').textContent = mmss(MOB.left);
      const C = 2 * Math.PI * 88;
      $('mobRing').style.strokeDashoffset = C * (1 - Math.max(0, MOB.left) / total);
    }
    if (!MOB.paused && MOB.phase === 'go' && MOB.left <= 3.05 && MOB.left > 0 && Math.abs(MOB.left - Math.round(MOB.left)) < .13) beep(660, .08);
    if (!MOB.paused && MOB.left <= 0) {
      if (MOB.phase === 'prep') { beep(1046, .25); mobPhase('go'); render(); }
      else { alarm(); if (MOB.idx + 1 >= MOBILITY.length) mobFinish(); else { MOB.idx++; mobPhase('prep'); render(); } }
    }
  }
}
setInterval(tick, 250);

function ring(val, target, { size = 140, stroke = 12, color = MAC.k, label = '', sub = '' } = {}) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, p = target > 0 ? Math.min(val / target, 1) : 0, over = val > target * 1.05;
  return `<div class="relative shrink-0" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" class="-rotate-90">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#1f2f4a" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${over ? '#ff7a1a' : color}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" style="transition:stroke-dashoffset .6s"/>
    </svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
      <span class="font-display text-3xl font-bold leading-none tabular-nums">${label}</span>
      <span class="text-[11px] text-slate-400 mt-1 leading-tight">${sub}</span>
    </div></div>`;
}
function bar(label, val, target, color, unit = 'g') {
  const p = target > 0 ? Math.min(val / target * 100, 100) : 0, over = val > target * 1.08;
  return `<div>
    <div class="flex justify-between text-sm mb-1"><span class="font-semibold" style="color:${color}">${label}</span>
      <span class="tabular-nums text-slate-200">${r0(val)} <span class="text-slate-500">/ ${r0(target)} ${unit}</span></span></div>
    <div class="h-2.5 rounded-full bg-ink-600 overflow-hidden"><div class="h-full rounded-full transition-all" style="width:${p}%;background:${over ? '#ff7a1a' : color}"></div></div>
  </div>`;
}
const macroLine = m => `<span class="tabular-nums"><b class="text-white">${r0(m.kcal)}</b> kcal · <span style="color:${MAC.p}">P ${r0(m.p)}</span> · <span style="color:${MAC.f}">L ${r0(m.f)}</span> · <span style="color:${MAC.c}">G ${r0(m.c)}</span></span>`;
const stat = (label, value, sub = '') => `<div class="rounded-xl bg-ink-700/60 p-3"><p class="text-[11px] uppercase tracking-wider text-slate-400">${label}</p><p class="font-display text-2xl font-bold tabular-nums">${value}</p>${sub ? `<p class="text-xs text-slate-400">${sub}</p>` : ''}</div>`;
const tabs = (items, cur, action) => `<div class="flex gap-1 p-1 rounded-xl bg-ink-800 border border-ink-600/60 mb-4">${items.map(([v, l, i]) => `<button class="tab ${cur === v ? 'tab-on' : ''} inline-flex items-center justify-center gap-1.5" data-a="${action}" data-v="${v}">${i ? ic(i, 'w-4 h-4') : ''}${l}</button>`).join('')}</div>`;
const pageTitle = (t, sub = '') => `<header class="mb-5">${sub ? `<p class="text-slate-400 text-sm first-letter:uppercase">${sub}</p>` : ''}<h1 class="h-title text-3xl lg:text-4xl">${t}</h1></header>`;

      <div class="flex items-center gap-4">

function renderWorkout() {
  const A = D.active;
  if (!A) return renderWorkoutStart();
  const act = A.exercises.filter(e => !e.skipped);
  const total = act.reduce((s, e) => s + e.sets.length, 0), done = act.reduce((s, e) => s + e.sets.filter(x => x.done).length, 0);
  return `
  <div class="sticky top-0 z-20 -mx-4 lg:-mx-8 px-4 lg:px-8 py-3 bg-ink-900/90 backdrop-blur border-b border-ink-600/60 mb-4">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0"><p class="text-[11px] text-slate-400 uppercase tracking-wider">Séance en cours</p>
        <h1 class="h-title leading-none">${typeLabel(A.type)} <span id="elapsed" class="text-arc tabular-nums text-xl ml-1"></span></h1></div>
      <button class="btn btn-primary shrink-0" data-a="finishSession">${ic('flag')} Terminer</button>
    </div>
    <div class="mt-3 flex items-center gap-3"><div class="flex-1 h-2 rounded-full bg-ink-600 overflow-hidden"><div class="h-full bg-arc transition-all" style="width:${total ? done / total * 100 : 0}%"></div></div>

      <button class="btn btn-sm btn-ghost shrink-0" data-a="manualRest">${ic('timer', 'w-4 h-4')} Repos ${D.settings.rest}s</button>
      <button class="btn btn-sm btn-danger shrink-0" data-a="cancelSession">${ic('x', 'w-4 h-4')} Abandonner</button>
    </div>
  </div>
  ${A.express ? '<p class="text-sm text-orange-300 mb-3 flex gap-2 items-center">' + ic('zap', 'w-4 h-4') + 'Mode express : exercices secondaires sautés, priorité aux mouvements principaux.</p>' : ''}
  <div class="grid gap-4 xl:grid-cols-2">${A.exercises.map(exCard).join('')}</div>`;

const SET_GRID = 'grid grid-cols-[1.1rem_1fr_1fr_3.9rem_3rem] gap-1.5 items-center';
const RPE_OPTS = [1, 2, 3, 4, 5, 6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10];
function exCard(e, i) {
  const sg = e.sugg;
  const cls = { up: 'bg-arc/15 text-arc', reps: 'bg-sky-400/15 text-sky-300', hold: 'bg-amber-400/15 text-amber-300', warn: 'bg-flame/15 text-orange-300', new: 'bg-ink-600 text-slate-300' }[sg.type];
  const icn = { up: 'trending-up', reps: 'repeat', hold: 'pause', warn: 'triangle-alert', new: 'sparkles' }[sg.type];
  const allDone = e.sets.length && e.sets.every(s => s.done);
  return `<section class="card ${e.skipped ? 'opacity-50' : ''} ${allDone ? '!border-arc/50' : ''}">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0"><h3 class="font-bold text-lg leading-tight flex items-center gap-2">${allDone ? ic('circle-check', 'w-5 h-5 text-arc shrink-0') : ''}${esc(e.name)}</h3>
        <p class="text-xs text-slate-400 mt-0.5">${e.sets.length} × ${e.repMin}-${e.repMax} reps · repos ${e.rest}s${e.secondary ? ' · <span class="text-orange-300">secondaire</span>' : ''}</p></div>
      <button class="btn btn-sm btn-ghost shrink-0" data-a="skipEx" data-i="${i}">${e.skipped ? 'Reprendre' : 'Passer'}</button>
    </div>
    ${e.skipped ? '' : `
    <div class="flex items-center gap-2 mt-3"><span class="chip bg-arc/15 text-arc tabular-nums">${ic('gauge', 'w-3.5 h-3.5')} Tempo ${esc(tempoStr(e.tempo))}</span><button class="btn btn-sm btn-ghost !h-8" data-a="tempoOpen" data-i="${i}">${ic('play', 'w-3.5 h-3.5')} Guide</button></div>
    <p class="text-xs text-slate-400 mt-2">${e.prev ? `Dernière fois (${fmtShort(e.prev.date)}) : <span class="text-slate-200 tabular-nums">${e.prev.sets.map(s => `${fmtKg(s.kg)}×${s.reps}${s.rpe ? '@' + fr(s.rpe) : ''}`).join(' · ')}</span>` : 'Aucun historique pour cet exercice'}</p>
    <div class="mt-2 text-sm rounded-lg px-3 py-2 ${cls} flex gap-2 items-start">${ic(icn, 'w-4 h-4 mt-0.5 shrink-0')}<span>${esc(sg.text)}</span></div>
    <div class="mt-3 ${SET_GRID} text-[10px] uppercase tracking-wider text-slate-500"><span>#</span><span class="text-center">Kg</span><span class="text-center">Reps</span><span class="text-center">RPE</span><span></span></div>
    <div class="space-y-1.5 mt-1">${e.sets.map((s, j) => setRow(i, s, j)).join('')}</div>
    <div class="flex gap-2 mt-3">
      <button class="btn btn-sm btn-ghost flex-1" data-a="addSet" data-i="${i}">${ic('plus', 'w-4 h-4')} Série</button>
      <button class="btn btn-sm btn-ghost flex-1" data-a="delSet" data-i="${i}" ${e.sets.length <= 1 ? 'disabled' : ''}>${ic('minus', 'w-4 h-4')} Série</button>
    </div>`}
  </section>`;
}
function setRow(i, s, j) {
  const d = `data-e="${i}" data-s="${j}"`, dim = s.done ? 'opacity-60' : '';
  return `<div class="${SET_GRID}">
    <span class="text-sm font-bold text-slate-500 text-center">${j + 1}</span>
    <input class="inp !h-12 !px-1 text-center text-lg font-semibold tabular-nums ${dim}" type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" value="${esc(s.kg)}" data-in="set" ${d} data-f="kg">
    <input class="inp !h-12 !px-1 text-center text-lg font-semibold tabular-nums ${dim}" type="number" inputmode="numeric" step="1" min="0" placeholder="reps" value="${esc(s.reps)}" data-in="set" ${d} data-f="reps">
    <select class="inp !h-12 !px-1 text-center ${dim}" data-in="set" ${d} data-f="rpe" aria-label="RPE"><option value="">–</option>${RPE_OPTS.map(v => `<option value="${v}" ${String(s.rpe) === String(v) ? 'selected' : ''}>${fr(v)}</option>`).join('')}</select>
    <button class="h-12 rounded-xl flex items-center justify-center transition ${s.done ? 'bg-arc text-ink-900' : 'bg-ink-600 text-slate-300'}" data-a="doneSet" ${d} aria-label="Valider la série">${ic('check', 'w-6 h-6')}</button>
  </div>`;
}

function updateDraftTotals() {

function fillIngFromFood(k, force) {
  const g = DRAFT.ingredients[k], f = D.foods.find(x => x.name.toLowerCase() === (g.name || '').trim().toLowerCase());
  if (!f) return;
  if (!force && (num(g.kcal) || num(g.p) || num(g.f) || num(g.c))) return;
  ['kcal', 'p', 'f', 'c'].forEach(m => { g[m] = f[m]; const el = $(`ing_${k}_${m}`); if (el) el.value = f[m]; });
  updateDraftTotals();
}
function saveRecipe() {
  const r = DRAFT;
  r.name = (r.name || '').trim(); r.ingredients = r.ingredients.filter(i => (i.name || '').trim());
  if (!r.name) return toast('Donne un nom à la recette', 'err');
  if (!r.ingredients.length) return toast('Ajoute au moins un ingrédient', 'err');
  r.portions = Math.max(1, Math.round(num(r.portions)) || 1);
  r.ingredients.forEach(i => {
    ['qty', 'kcal', 'p', 'f', 'c'].forEach(m => i[m] = num(i[m]));
    if (!D.foods.some(f => f.name.toLowerCase() === i.name.trim().toLowerCase()) && i.kcal) D.foods.push(food(i.name.trim(), i.kcal, i.p, i.f, i.c));
  });
  if (r.id) D.recipes = D.recipes.map(x => x.id === r.id ? r : x); else { r.id = uid(); D.recipes.push(r); }
  save(); closeModal(); render(); toast('Recette enregistrée');
}

/* ---- Graphiques (Chart.js) ---- */
function chartOpts(unit) {
  return {
    responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { labels: { color: '#cbd5e1', boxWidth: 12 } }, tooltip: { callbacks: { label: c => `${c.dataset.label} : ${fr(c.parsed.y, 2)} ${unit}` } } },
    scales: { x: { ticks: { color: '#64748b', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,.04)' } }, y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,.06)' } } },
  };
}
function drawCharts() {
  if (!window.Chart) return;
  Object.values(CH).forEach(c => c && c.destroy()); for (const k in CH) delete CH[k];
  const series = weightSeries();
  const w = $('wChart');
  if (w && series.length >= 2) {
    const last = series[series.length - 1].date;
    const data = UI.wRange ? series.filter(x => daysBetween(x.date, last) < UI.wRange) : series;
    CH.w = new Chart(w, { type: 'line', data: { labels: data.map(d => fmtShort(d.date)), datasets: [
      { label: 'Poids', data: data.map(d => d.kg), borderColor: 'rgba(77,163,255,.45)', backgroundColor: '#4da3ff', pointRadius: 3, borderWidth: 1.5, tension: .2 },
      { label: 'Moyenne 7 j', data: data.map(d => r1(d.avg * 10) / 10), borderColor: '#a5d8ff', borderWidth: 3, pointRadius: 0, tension: .35 },
    ] }, options: chartOpts('kg') });
  }
  const dw = $('dashW');
  if (dw && series.length >= 2) {
    const data = series.slice(-30);
    CH.dw = new Chart(dw, { type: 'line', data: { labels: data.map(d => fmtShort(d.date)), datasets: [{ label: 'Moy. 7 j', data: data.map(d => d.avg), borderColor: '#7dd3fc', borderWidth: 2.5, pointRadius: 0, tension: .35, fill: true, backgroundColor: 'rgba(125,211,252,.1)' }] },
      options: { ...chartOpts('kg'), plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { ticks: { color: '#64748b', maxTicksLimit: 3 }, grid: { color: 'rgba(255,255,255,.05)' } } } } });
  }
  const rc = $('rChart');
  if (rc) {
    const t = todayISO(), ws = weekStart(t);
    const weeks = Array.from({ length: 8 }, (_, k) => addDays(ws, (k - 7) * 7));
    const km = weeks.map(w => runsInRange(w, addDays(w, 6)).reduce((s, r) => s + num(r.distance), 0));
    CH.r = new Chart(rc, { type: 'bar', data: { labels: weeks.map(fmtShort), datasets: [{ label: 'Km', data: km, backgroundColor: '#4da3ff', borderRadius: 6 }] },
      options: { ...chartOpts('km'), plugins: { legend: { display: false } } } });
  }
}

  },
  delWeight: el => { D.weights = D.weights.filter(w => w.date !== el.dataset.v); save(); render(); },
  pickFeel: el => { RUNFORM.feel = +el.dataset.v; document.querySelectorAll('#r_feel button').forEach(b => { const on = +b.dataset.v === RUNFORM.feel; b.className = `h-12 rounded-xl text-2xl ${on ? 'bg-arc/20 ring-2 ring-arc' : 'bg-ink-700'}`; }); },
  pickKnee: el => { RUNFORM.knee = +el.dataset.v; document.querySelectorAll('#r_knee button').forEach(b => { const on = +b.dataset.v === RUNFORM.knee; b.className = `h-11 rounded-xl text-sm font-semibold ${on ? 'bg-arc/20 ring-2 ring-arc' : 'bg-ink-700'}`; }); },
  saveRun: () => {
    const duration = num($('r_dur').value), distance = num($('r_dist').value);
    if (!duration && !distance) return toast('Renseigne la durée ou la distance', 'err');
    D.runs.push({ id: uid(), at: Date.now(), date: $('r_date').value || todayISO(), type: $('r_type').value, duration, distance, feel: RUNFORM.feel, knee: RUNFORM.knee, notes: $('r_notes').value.trim() });
    Object.assign(RUNFORM, { feel: 3, knee: 0 }); save(); render(); toast('Sortie enregistrée — bonus kcal appliqué ce jour-là');
  },
  delRun: el => { if (!confirm('Supprimer cette sortie ?')) return; D.runs = D.runs.filter(r => r.id !== el.dataset.id); save(); render(); },
  // --- Mobilité
  mobStart, mobScale: el => { MOB.scale = +el.dataset.v; render(); },
  mobPause: () => { MOB.paused = !MOB.paused; render(); },
  mobNext: () => mobGoto(MOB.idx + 1), mobPrev: () => mobGoto(MOB.idx - 1),
  mobStop: () => { MOB.on = false; keepAwake(false); render(); },
  // --- Réglages
  progType: el => { UI.progType = el.dataset.v; render(); },
  progAdd: () => { D.program[UI.progType].push(ex('Nouvel exercice', 3, 8, 12, 2.5, false, 90)); save(); render(); },
  progDel: el => { if (!confirm('Supprimer cet exercice du programme ? (l\'historique est conservé)')) return; D.program[UI.progType].splice(+el.dataset.i, 1); save(); render(); },
  progMove: el => { const l = D.program[UI.progType], i = +el.dataset.i, j = i + +el.dataset.v; [l[i], l[j]] = [l[j], l[i]]; save(); render(); },
  toggleSound: () => { D.settings.sound = !D.settings.sound; save(); render(); if (D.settings.sound) beep(); },
  swapNext: () => { D.next = D.next === 'upper' ? 'lower' : 'upper'; save(); render(); },
  resetTargets: () => { Object.assign(D.settings, { kcal: 2616, p: 181, f: 78, c: 296, runBonus: 200 }); save(); render(); },
  exportData: () => {
    const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bluearc-sauvegarde-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Sauvegarde exportée');
  },
  importData: () => $('importFile').click(),
  resetAll: () => { if (!confirm('Effacer TOUTES les données de cet appareil ?')) return; if (!confirm('Vraiment ? Exporte d\'abord si besoin.')) return; D = defaultData(); save(); render(); toast('Données réinitialisées'); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) fn(el, e);
});

/* Saisie en direct (sans re-rendu pour garder le focus) */
function onInput(e) {
  const el = e.target, k = el.dataset.in; if (!k) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if (k === 'set' && D.active) { D.active.exercises[el.dataset.e].sets[el.dataset.s][el.dataset.f] = val; save(); }
  else if (k === 'draft' && DRAFT) { DRAFT[el.dataset.f] = val; updateDraftTotals(); }
  else if (k === 'ing' && DRAFT) {
    const g = DRAFT.ingredients[el.dataset.k]; g[el.dataset.f] = val;
    if (el.dataset.f === 'name') fillIngFromFood(+el.dataset.k, e.type === 'change');
    updateDraftTotals();
  }
  else if (k === 'shop') { D.shopChecked[el.dataset.k] = val; save(); if (e.type === 'change') render(); }
  else if (k === 'setting') {
    D.settings[el.dataset.k] = num(val); save();
    if ($('macroK')) $('macroK').textContent = `Les macros représentent ${r0(D.settings.p * 4 + D.settings.f * 9 + D.settings.c * 4)} kcal.`;
    if (el.dataset.k === 'runBonus' && $('bonusVal')) $('bonusVal').textContent = `+${val} kcal`;
  }
  else if (k === 'prog') {
    const ex = D.program[UI.progType][el.dataset.i], f = el.dataset.f;
    ex[f] = (f === 'name' || f === 'tempo') ? val : f === 'secondary' ? !!val : num(val); save();
  }
}
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);

$('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!data || typeof data !== 'object' || !data.settings) throw new Error('format');
      if (!confirm('Remplacer les données actuelles par celles du fichier ?')) return;
      D = migrate(data); save(); render(); toast('Données importées ✅');
    } catch (err) { toast('Fichier invalide', 'err'); }
    e.target.value = '';
  };
  rd.readAsText(f);
});

window.addEventListener('hashchange', () => { UI.view = location.hash.slice(1) || 'dash'; render(); window.scrollTo(0, 0); });
document.addEventListener('pointerdown', () => audio(), { once: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (D.active || MOB.on) keepAwake(true); if (UI.nutriDate !== todayISO() && UI.view !== 'nutrition') UI.nutriDate = todayISO(); tick(); syncNow(); } });
window.addEventListener('storage', e => { if (e.key === KEY) { D = load(); render(); } });

/* ---- Démarrage ---- */
UI.view = location.hash.slice(1) || 'dash';
buildNav();
render();
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 's_name' || e.target.id === 's_qty')) { e.preventDefault(); A.addShopItem(); } });
syncNow();
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 45000);
</script>
</body>
</html>
